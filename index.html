<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>🔥 火花助手</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- 登录页 -->
  <section id="auth-view" class="view hidden">
    <div class="auth-card">
      <div class="logo">🔥</div>
      <h1>抖音火花助手</h1>
      <p class="subtitle">自动检测火花剩余有效期，快灭时自动续，永不断火</p>
      <div id="auth-msg" class="msg hidden"></div>
      <form id="auth-form" autocomplete="on">
        <label class="field">
          <span>邮箱</span>
          <input type="email" id="auth-email" placeholder="you@example.com" required>
        </label>
        <label class="field">
          <span>密码</span>
          <input type="password" id="auth-pass" placeholder="至少 6 位" minlength="6" required>
        </label>
        <button type="submit" id="auth-submit" class="btn primary">登录 / 注册</button>
      </form>
      <button id="magic-link" class="btn ghost">用邮箱验证码登录</button>
      <p class="hint">首次登录自动注册账号。注册后即可扫码绑定抖音号。</p>
    </div>
  </section>

  <!-- 主面板 -->
  <section id="main-view" class="view hidden">
    <header class="topbar">
      <div class="brand">🔥 火花助手</div>
      <div class="topbar-right">
        <button id="check-all" class="btn small">立即检查</button>
        <button id="logout" class="btn ghost small">退出</button>
      </div>
    </header>

    <div id="banner" class="banner hidden"></div>

    <main class="container">
      <!-- 抖音号 -->
      <div class="section">
        <div class="section-head">
          <h2>我的抖音号</h2>
          <button id="bind-btn" class="btn primary small">＋ 绑定抖音号</button>
        </div>
        <div id="sessions" class="sessions"></div>
      </div>

      <!-- 好友火花 -->
      <div class="section">
        <div class="section-head">
          <h2>好友火花</h2>
          <span id="friends-summary" class="muted"></span>
        </div>
        <div id="friends" class="friends"></div>
        <div id="friends-empty" class="empty hidden">
          <p>还没有好友数据</p>
          <p class="muted">绑定抖音号后点「立即检查」拉取火花状态</p>
        </div>
      </div>

      <!-- 设置 -->
      <div class="section">
        <div class="section-head"><h2>自动续火花设置</h2></div>
        <div id="settings-box" class="settings">
          <label class="switch-row">
            <span>
              <b>自动续火花</b>
              <small>到期前自动给好友发消息，无需手动操作</small>
            </span>
            <input type="checkbox" id="set-auto">
          </label>
          <label class="field">
            <span>提前天数（剩余 ≤ 该天数时发送）</span>
            <input type="number" id="set-ddl" min="1" max="30" value="3">
          </label>
          <label class="field">
            <span>续火花消息内容</span>
            <input type="text" id="set-msg" maxlength="40" value="火花要灭了，续一下🔥">
          </label>
          <button id="save-settings" class="btn primary">保存设置</button>
        </div>
      </div>

      <!-- 历史 -->
      <div class="section">
        <div class="section-head"><h2>发送记录</h2></div>
        <div id="history" class="history"></div>
        <div id="history-empty" class="empty hidden"><p class="muted">暂无发送记录</p></div>
      </div>
    </main>
  </section>
</div>

<!-- 扫码弹窗 -->
<div id="qr-modal" class="modal hidden">
  <div class="modal-box">
    <button class="modal-close" id="qr-close">✕</button>
    <h2>用抖音 App 扫码绑定</h2>
    <p class="muted">首次绑定需等待登录环境启动（约 1-2 分钟），出现二维码后用抖音 App 扫一扫</p>
    <div id="qr-wrap" class="qr-wrap"><img id="qr-img" alt="二维码"></div>
    <div id="qr-verify" class="qr-verify hidden">
      <p id="qr-verify-tip" class="qr-verify-tip">抖音向手机号发送了短信验证码，请输入后完成绑定</p>
      <div class="qr-verify-row">
        <input id="qr-code-input" class="qr-code-input" inputmode="numeric" maxlength="6" placeholder="6位验证码" autocomplete="one-time-code">
        <button id="qr-code-submit" class="btn primary">确认</button>
      </div>
      <p id="qr-verify-hint" class="muted"></p>
    </div>
    
    <div id="sms-form" style="display:none; padding: 20px;">
      <h3 style="margin-bottom: 15px; text-align: center;">📱 短信验证码登录</h3>
      <p style="color: #666; font-size: 14px; margin-bottom: 20px; text-align: center;">
        输入手机号，收到验证码后输入即可绑定<br>
        <small>（比扫码更稳定，不需要电脑）</small>
      </p>
      
      <div style="margin-bottom: 15px;">
        <input type="tel" id="sms-phone" placeholder="请输入手机号" 
               style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px;"
               maxlength="11">
      </div>
      
      <button id="sms-send-btn" onclick="sendSmsCode()" 
              style="width: 100%; padding: 12px; background: #ff2442; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;">
        发送验证码
      </button>
      
      <div id="sms-verify-form" style="display:none; margin-top: 20px;">
        <div style="margin-bottom: 15px;">
          <input type="text" id="sms-code" placeholder="请输入验证码" 
                 style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px;"
                 maxlength="6">
        </div>
        
        <button onclick="verifySmsCode()" 
                style="width: 100%; padding: 12px; background: #07c160; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;">
          登录绑定
        </button>
      </div>
      
      <p style="color: #999; font-size: 12px; margin-top: 15px; text-align: center;">
        验证码有效期 60 秒，过期需重新发送
      </p>
    </div>
  <p id="qr-status"等待扫码…</p>
    <button id="qr-cancel" class="btn ghost">取消</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
